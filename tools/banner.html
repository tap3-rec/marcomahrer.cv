<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1584px;height:396px;overflow:hidden}
  body{font-family:Inter,sans-serif;position:relative;color:var(--ink);background:var(--bg)}
  body.light{--bg:#F7F3EC;--ink:#17131F;--ink2:#4B4553;--ink3:#8B8592;--line:#E4DDD1;--grad:linear-gradient(100deg,#301c57 0%,#DF3912 58%,#EB6320 100%);--ga:rgba(235,99,32,.22);--gb:rgba(48,28,87,.16)}
  body.dark{--bg:#131117;--ink:#EFEAE2;--ink2:#BDB6C4;--ink3:#837C8C;--line:#2B2733;--grad:linear-gradient(100deg,#C4B5FD 0%,#F0583A 58%,#F58A4C 100%);--ga:rgba(245,138,76,.18);--gb:rgba(167,139,250,.16)}
  body::before{content:"";position:absolute;inset:0;background:radial-gradient(45% 90% at 92% 0%,var(--ga),transparent 70%),radial-gradient(35% 80% at 8% 100%,var(--gb),transparent 70%)}
  .in{position:absolute;inset:0;padding:0 84px 0 0;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;text-align:right}
  .eyebrow{font-size:17px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);margin-bottom:18px}
  .eyebrow sup{font-size:.72em;line-height:0;vertical-align:.5em;color:#EB6320;font-weight:700;letter-spacing:0}
  .eyebrow::after{content:"";display:inline-block;width:34px;height:2px;background:#EB6320;vertical-align:middle;margin-left:16px}
  h1{font-family:Fraunces,Georgia,serif;font-weight:500;font-variation-settings:"opsz" 144;font-size:96px;line-height:.98;letter-spacing:-.025em;margin:0}
  h1 em{font-style:italic;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;padding-right:.06em}
  .url{position:absolute;right:84px;bottom:34px;font-size:18px;color:var(--ink3);letter-spacing:.02em}
  /* variant: stats */
  .stats{display:flex;gap:0;margin-top:30px;border-top:1px solid var(--line);padding-top:22px}
  .stats[hidden]{display:none}
  .stat{padding:0 34px;border-left:1px solid var(--line);text-align:left}
  .stat:first-child{border-left:0;padding-left:0}
  .stat b{display:block;font-family:Fraunces,Georgia,serif;font-weight:500;font-size:40px;letter-spacing:-.03em;line-height:1;font-variation-settings:"opsz" 72}
  .stat span{display:block;margin-top:8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
  body.stats-variant h1{font-size:64px}
  body.stats-variant .in{justify-content:center}
</style></head><body class="light">
<div class="in">
  <div class="eyebrow">Talent Acquisition Partner<sup>3</sup> · Zürich</div>
  <h1 id="h">Recruitment <em>that scales.</em></h1>
  <div class="stats" id="stats" hidden>
    <div class="stat"><b>4,500+</b><span>Interviews</span></div>
    <div class="stat"><b>350+</b><span>Hires</span></div>
    <div class="stat"><b>15</b><span>Years in tech TA</span></div>
    <div class="stat"><b>5</b><span>Orgs grown</span></div>
    <div class="stat"><b>3</b><span>Unicorns</span></div>
  </div>
</div>
<div class="url">marcomahrer.cv</div>
</body></html>
