<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:#F7F3EC;color:#17131F;font-family:Inter,sans-serif;position:relative}
  body::before{content:"";position:absolute;inset:0;background:radial-gradient(55% 55% at 88% -5%,rgba(235,99,32,.22),transparent 70%),radial-gradient(45% 45% at -5% 30%,rgba(48,28,87,.16),transparent 70%)}
  .in{position:absolute;inset:0;padding:84px 96px;display:flex;flex-direction:column;justify-content:space-between}
  .eyebrow{font-size:20px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:#8B8592}
  .eyebrow sup{font-size:.7em;line-height:0;vertical-align:.45em;margin-left:1px;color:#EB6320}
  .eyebrow::before{content:"";display:inline-block;width:34px;height:2px;background:#EB6320;vertical-align:middle;margin-right:16px}
  h1{font-family:Fraunces,Georgia,serif;font-weight:500;font-variation-settings:"opsz" 144;font-size:104px;line-height:.98;letter-spacing:-.025em;margin:0;max-width:14ch}
  h1.post{font-size:84px;max-width:16ch}
  h1 em{background:linear-gradient(100deg,#301c57 0%,#DF3912 58%,#EB6320 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;padding-right:.08em}
  .foot{display:flex;justify-content:space-between;align-items:flex-end;font-size:24px;color:#4B4553}
  .name{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:34px;color:#17131F;letter-spacing:-.02em}
</style></head><body><div class="in">
  <div class="eyebrow" id="eyebrow">Talent Acquisition Partner<sup>3</sup> · Zürich</div>
  <h1 id="title">I build hiring functions <em>that scale.</em></h1>
  <div class="foot"><span class="name">Marco Mahrer</span><span>marcomahrer.cv</span></div>
</div></body></html>
